---
- name: Ensure GNOME Boxes images directory exists
  ansible.builtin.file:
    path: "/home/green/.local/share/gnome-boxes/images"
    state: directory
    mode: '0755'

- name: Create qcow2 disk image for the VM
  ansible.builtin.command:
    cmd: "qemu-img create -f qcow2 /home/green/.local/share/gnome-boxes/images/{{ vm_name }} 60G"
    creates: "/home/green/.local/share/gnome-boxes/images/{{ vm_name }}"

- name: Generate libvirt XML configuration from template
  ansible.builtin.template:
    src: win2k25_template.xml.j2
    dest: "/tmp/{{ vm_name }}.xml"
    mode: '0644'

- name: Define the VM in libvirt
  ansible.builtin.command:
    cmd: "virsh define /tmp/{{ vm_name }}.xml"
  register: virsh_define
  changed_when: "'Domain' in virsh_define.stdout and 'defined from' in virsh_define.stdout"

- name: Start the VM to reach the interactive installation
  ansible.builtin.command:
    cmd: "virsh start {{ vm_name }}"
  register: virsh_start
  changed_when: "'Domain' in virsh_start.stdout and 'started' in virsh_start.stdout"

- name: Clean up temporary XML file
  ansible.builtin.file:
    path: "/tmp/{{ vm_name }}.xml"
    state: absent
