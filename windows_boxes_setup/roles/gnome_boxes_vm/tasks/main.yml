---
- name: S'assurer que le répertoire d'images GNOME Boxes existe
  file:
    path: "{{ lookup('env', 'HOME') }}/.local/share/gnome-boxes/images"
    state: directory
    mode: '0755'

- name: Vérifier si la VM existe dans libvirt
  shell: virsh --connect qemu:///session domuuid "{{ vm_name }}"
  register: vm_exists
  failed_when: false
  changed_when: false

- name: Arrêter la VM existante si elle est en cours d'exécution
  command: virsh --connect qemu:///session destroy "{{ vm_name }}"
  when: vm_exists.rc == 0
  failed_when: false

- name: Supprimer la définition de la VM existante (avec ses snapshots)
  command: virsh --connect qemu:///session undefine "{{ vm_name }}" --snapshots-metadata
  when: vm_exists.rc == 0

- name: Nettoyer l'ancienne ISO unattend et l'image disque
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ lookup('env', 'HOME') }}/.local/share/gnome-boxes/images/unattend_{{ vm_name }}.iso"
    - "{{ lookup('env', 'HOME') }}/.local/share/gnome-boxes/images/{{ vm_name }}"

- name: Créer le dossier temporaire de préparation d'unattended
  file:
    path: "/tmp/unattend_{{ vm_name }}"
    state: directory
    mode: '0755'

- name: Générer le fichier Autounattend.xml
  template:
    src: autounattend.xml.j2
    dest: "/tmp/unattend_{{ vm_name }}/Autounattend.xml"
    mode: '0644'

- name: Créer la mini-ISO de réponse pour Windows
  command: >
    xorrisofs -joliet -rock -volid cidata
    -output "{{ lookup('env', 'HOME') }}/.local/share/gnome-boxes/images/unattend_{{ vm_name }}.iso"
    "/tmp/unattend_{{ vm_name }}"

- name: Nettoyer le dossier temporaire d'unattended
  file:
    path: "/tmp/unattend_{{ vm_name }}"
    state: absent

- name: Créer l'image disque qcow2 vierge
  command: >
    qemu-img create -f qcow2
    "{{ lookup('env', 'HOME') }}/.local/share/gnome-boxes/images/{{ vm_name }}"
    64G

- name: Générer la configuration XML libvirt
  template:
    src: win2k25_template.xml.j2
    dest: "/tmp/{{ vm_name }}.xml"
    mode: '0644'

- name: Définir la VM dans libvirt (session utilisateur)
  command: virsh --connect qemu:///session define "/tmp/{{ vm_name }}.xml"
